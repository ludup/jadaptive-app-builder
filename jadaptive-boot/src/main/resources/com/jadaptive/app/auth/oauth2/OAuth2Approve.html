<!DOCTYPE html>
<html lang="en" xmlns:jad="https://jadaptive.com/jadaptive">
<head>
<title jad:bundle="oauth2" jad:i18n="approve">Approve</title>
</head>
<body>
	<div class="wrapper">
		<header jad:id="header"></header>
		<main class="container my-auto">
			<div class="row justify-content-center">
				<div class="col-6">
					<div class="card">
						<div class="card-header text-center">
							<span jad:bundle="oauth2" jad:i18n="approve">Approve</span>
						</div>
						<div class="card-body text-left">
                   			<form id="approveForm" method="POST" autocomplete="off">
                   				<input type="hidden" id="approved" name="approved" value="true"/>
								<div class="row" id="alerts">
								</div>
								<div class="row mt-3">
									<div class="col-md-2">
										<i class="fa-solid fa-handshake-simple text-success fa-3x align-middle"></i>&nbsp;
									</div>
									<div class="col-md-10">
										<div class="text-muted" jad:bundle="oauth2" jad:i18n="approve.text">Something is requesting ....</div>
										<div class="mt-3 mb-2">
											<span class="align-middle" id="detail">Details ...</span>
										</div>
										<ul id="scopes">
										</ul>
									</div>
								</div>
								<div class="row mt-4 text-center">
									<div class="col-md-12">
										<button style="width: 10em;" id="approve" type="submit" class="btn btn-primary">
											<span jad:bundle="oauth2" jad:i18n="approve.approve">Approve</span></button>
										&nbsp; <a href="#" id="reject" jad:bundle="oauth2" jad:i18n="approve.reject">Reject</a>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>
	<footer jad:id="footer"></footer>
</body>
</html>
