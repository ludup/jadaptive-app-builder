oauth2Applications.names=Applications

name.name=Name
name.desc=The name of this application. This would be provided by clients in the \
	<strong>client_id</strong> parameter.
secret.name=Secret
secret.desc=Require that authorizations provide this <strong>client_secret</strong> when requesting tokens.
redirectUris.name=Redirect URIs
redirectUris.desc=A regular expression describing what is allowed as a <strong>redirect_uri</strong> parameter.\
	These are the locations a requestor is allowed to redirect to after approving an authentication. 
	If this list is empty, any redirect URI will be allow. This is not recommended on production systems.
grantType.name=Grant Type
grantType.desc=How this application should be used.
expiryTime.name=Token Expiry Time
expiryTime.desc=How long in seconds tokens should be valid for before expiring.
issueRefreshToken.name=Refresh Token
issueRefreshToken.desc=Whether or not a refresh token should be issued with token requests. These may be used to re-authorize an expired token.

