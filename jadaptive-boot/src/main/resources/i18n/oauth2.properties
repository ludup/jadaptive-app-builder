oauth2.name=OAuth2
oauth2.desc=Configure how external applications may authenticate and interact with this server.

options.name=Tokens
device.name=Device Tokens

requireApplicationRegistration.name=Require Application Registration
requireApplicationRegistration.desc=When enabled, relevant OAuth requests must include the \
	`client_id` and `client_secret` parameters. \
	These details must match the "Applications" as created \
	in Identity Services -> OAuth2 Applications, as well as match known a redirect URI. \
	When not enabled, anyone may be request an OAuth authenticated service, subject to the permissions \
	of the authenticating user.
	
issueRefreshTokenForUnregisteredRequests.name=Issue Refresh For Unregistered Requests
issueRefreshTokenForUnregisteredRequests.desc=When unregistered requests are allowed, this switch \
	controls whether those requests will also get a refresh token.
	
defaultExpiryTime.name=Expiry
defaultExpiryTime.desc=By default, how long in seconds tokens should be valid for before expiring. \
	This may be overridden by individual applications.
	
deviceCodeExpiryTime.name=Expiry
deviceCodeExpiryTime.desc=How long in seconds should device token requests \
	be valid for.
	
deviceCodeInterval.name=Poll Interval
deviceCodeInterval.desc=The suggest interval in seconds between each poll for for device code approval status. \
	This is a suggested rate only, at this time no enforcement takes place.
	
deviceCodePattern.name=User Code Pattern
deviceCodePattern.desc=Describes the format of the <strong>User Code</strong>. For each \
	character required, use either 'A' or 'a' for alphabetic characters, '0' or '9' for \
	numeric, '!' for symbols. Also, '?' will randomly pick one of the these classes. Any \
	other character will be included as is. For example, for a code that is 4 letters, followed \
	by a dash, followed by 4 numbers, you would use <code>AAAA-9999</code>. \
	
device=Add Device
device.text=A device wishes to request permission to use this service. It will be displaying \
	a <strong>User Code</strong>, enter that here.
device.add=Add Device
device.reject=Reject 

approve=Approve Request
approve.text=An application or device is requesting access to the following resources or \
	features
approve.approve=Approve
approve.reject=Reject

error.invalidUserCode=User code incorrect. The code should be four upper-case letters, followed \
	by a ''-'', followed by another four upper-case letters.
error.approvalFailed=Failed to approve authorization. {0}
	
rejectedApproval.reason=Rejected by user.
