<!DOCTYPE html>
<html lang="en" xmlns:jad="https://jadaptive.com/jadaptive">
<head>
<title>Custom HTML Renderer</title>
</head>
<body>
	<div>
		<label jad:role="label" class="form-label"></label>
		<div class="input-group">
            <textarea jad:role="input" class="form-control"></textarea>
        </div>
        <small jad:role="help" class="form-text text-muted"></small>
	</div>
</body>
</html>
